name: Bug report
description: Something doesn't work as expected, in code or in Figma.
labels: ["bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [React package, Figma file, Both]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, what you expected, and how to reproduce it. A link or screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and browser
      placeholder: evenkeel-ui 1.1.0, Firefox 131
