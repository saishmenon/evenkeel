name: Release to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Typecheck, test, build
        run: |
          npm run build:tokens
          npm run typecheck
          npm test
          npm run build:lib
          npm run test:smoke

      - name: Publish
        # Skipped when this version is already on npm (for example, published by hand).
        # Pre-release tags (v1.1.0-beta.1) go to the "next" dist-tag.
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "evenkeel-ui@$VERSION" version >/dev/null 2>&1; then
            echo "evenkeel-ui@$VERSION is already on npm, skipping publish"; exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then TAG=next; else TAG=latest; fi
          npm publish --provenance --access public --tag "$TAG" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        # Uses this version's section of CHANGELOG.md as the release notes.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release already exists"; exit 0; fi
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Evenkeel $VERSION" --notes-file notes.md $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
